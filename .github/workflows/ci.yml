# CI: typecheck + full test suite + browser-bundle build + the sprag architectural
# gate, on every push/PR.
#
# The ratchet gates declared in invariants.json (complexity, function length,
# time-bomb tests, product-not-read-process, require-tests, durable-trail,
# config-relaxations) are enforced by the published sprag gate runner
# (@johnpwarren.dev/sprag) in the "Architectural gate" step below — no longer an
# external-harness-only claim. This workflow exists so that a red test suite, a
# broken build, or architectural regression can never sit unnoticed at HEAD.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup reads the pinned version from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # 10 clustersynth tests skip without locally generated fixtures
        # (see bench/README.md); skips are expected in CI.
        run: pnpm test

      - name: Browser bundle builds
        run: pnpm build:browser

      - name: Architectural gate (sprag)
        # Deterministic, offline ratchet vs the committed baseline. Exit 3 = a
        # blocked regression; exit 2 = engine unavailable (fails closed).
        run: npx --yes @johnpwarren.dev/sprag check . --invariants invariants.json --baseline-in baseline.json
