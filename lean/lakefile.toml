name = "tessera"
defaultTargets = ["Tessera"]

# Pinned to a TAG, not master: reproducible, and v4.32.1 is recent enough that its bundled LLVM
# emits SG_READ_ONLY on __DATA_CONST, which macOS 15.4+ dyld requires (leanprover/lean4#7917).
# v4.14.0 -- the version originally pinned here -- ships clang 15 and does not, which is why
# `lake exe cache get` died loading Mathlib's precompiled `cache` binary.
# `lean-toolchain` must match this tag.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "Tessera"
